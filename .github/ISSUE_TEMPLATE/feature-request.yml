name: Feature request
description: Propose a user-centered improvement for a TechTide AI project.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an improvement. A clear problem statement and expected user value make requests easier to evaluate.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate request.
          required: true
        - label: This request does not disclose a security vulnerability.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the user need, workflow friction, or limitation. Include who is affected and when it occurs.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or result that would make the problem meaningfully better.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Share an implementation idea if you have one. Maintainability, compatibility, and security trade-offs are useful context.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing workarounds, related tools, or alternative approaches.
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, mockups, prior art, or other relevant information. Do not include confidential information.
    validations:
      required: false
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
