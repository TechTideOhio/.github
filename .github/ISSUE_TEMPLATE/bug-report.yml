name: Bug report
description: Report a reproducible problem in a TechTide AI project.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a problem. Do not include security vulnerabilities, credentials, or personal data in this form. Please follow the [security policy](https://github.com/TechTideOhio/.github/blob/main/SECURITY.md) for suspected vulnerabilities.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I removed or redacted credentials, tokens, and personal data.
          required: true
  - type: input
    id: version
    attributes:
      label: Project version or commit
      description: Provide the release, package version, container tag, or commit SHA when available.
      placeholder: "Example: 0.4.0 or a1b2c3d"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the observed behavior and its user impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Describe the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable reproduction, including relevant commands or configuration.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include only information relevant to reproduction.
      value: |
        - OS:
        - Runtime and version:
        - Installation method:
        - Additional relevant configuration:
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste sanitized output or attach screenshots. Do not include secrets or personal data.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
